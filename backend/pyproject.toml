[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dazu-pos-backend"
version = "0.1.0"
description = "Kenyan POS backend (DaZu / Freshmart)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "PyJWT>=2.10",
  "pyotp>=2.9",
  "httpx>=0.27",
  "cryptography>=44.0",
  "python-multipart>=0.0.17",
  "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "aiosqlite>=0.20",
  "factory-boy>=3.3",
  "testcontainers[postgres,redis]>=4.8",
  "fakeredis>=2.26",
  "ruff>=0.11",
  "mypy>=1.15",
  "types-qrcode>=7.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["core/data/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
